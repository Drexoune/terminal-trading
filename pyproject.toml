[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-trading"
version = "0.0.1"
description = "Terminal de trading personnel : collecteurs et passerelle"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "httpx>=0.27",
  "certifi>=2024.2.2",  # certificats de wss:// (Python de python.org sur macOS)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["collectors", "gateway"]
include = ["terminal_collectors*", "terminal_gateway*"]

[tool.pytest.ini_options]
testpaths = ["collectors/tests", "gateway/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Jeu de règles explicite : il ne change pas avec la version de ruff.
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
