# Configuration de la CLI Supabase pour le Mode Online (voir supabase/README.md).
# Volontairement réduite : la CLI complète les sections absentes par ses valeurs
# par défaut (vérifié avec la CLI 2.121 : link, db push, functions deploy).
project_id = "terminal-trading"

[functions.okx-collector]
# Appelée chaque minute par pg_cron (pg_net), sans JWT : l'appel est
# authentifié par l'en-tête x-collector-secret, vérifié par la fonction.
verify_jwt = false

[functions.bourse-jobs]
# Module Bourse (B0) : appelée par pg_cron (supabase/cron-bourse.sql) et à la
# main pour la tâche explore. Sans JWT : l'en-tête x-jobs-secret est vérifié
# par la fonction.
verify_jwt = false

[functions.p1-jobs]
# Plan « Tout en ligne » (T-042) : sonde O0 (?job=explore), puis agenda, capture et
# alertes de P1, appelés par pg_cron. Sans JWT : l'en-tête x-jobs-secret est vérifié
# par la fonction (P1_JOBS_SECRET).
verify_jwt = false

[functions.p2-jobs]
# Plan P2 (écran Taux, T-049) : sonde R0 (?job=explore), puis collecte des probabilités de
# taux, appelée par pg_cron. Fonction distincte de p1-jobs : la capture de P1 n'est jamais
# redéployée pour P2. Sans JWT : l'en-tête x-jobs-secret est vérifié (P1_JOBS_SECRET, même secret).
verify_jwt = false

[functions.p3-jobs]
# Plan P3 (macro et heatmap, T-053) : sonde M0 (?job=explore), puis collecte macro, scores et
# backtest, appelés par pg_cron. Fonction distincte de p1-jobs et p2-jobs : leurs paquets ne
# changent pas. Sans JWT : l'en-tête x-jobs-secret est vérifié (P1_JOBS_SECRET, même secret).
verify_jwt = false
